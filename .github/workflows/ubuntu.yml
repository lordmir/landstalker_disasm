             echo cbbd700cad5034977b16b1ed1c0d66be87cfee0cc9baf53e90869065be986378 landstalker_fr_expanded.bin | sha256sum -c

      - name: Build DE Landstalker ROM
        working-directory: ${{github.workspace}}/landstalker_disasm
        shell: bash
        run: ./build.sh -r DE -o landstalker_de.bin | tee build_landstalker_de.log

      - name: Verify DE Landstalker ROM
        working-directory: ${{github.workspace}}/landstalker_disasm
        shell: bash
        run: |
             grep "Checksum: C867" build_landstalker_de.log
             echo 22b4e3dbca86dc179ee279fbcee9ce1569e6e21006815557ffd17a81d80647de landstalker_de.bin | sha256sum -c

      - name: Build DE Expanded Landstalker ROM
        working-directory: ${{github.workspace}}/landstalker_disasm
        shell: bash
        run: ./build.sh -r DE -e -o landstalker_de_expanded.bin | tee build_landstalker_de_expanded.log

      - name: Verify DE Expanded Landstalker ROM
        working-directory: ${{github.workspace}}/landstalker_disasm
        shell: bash
        run: |
             grep "Checksum: F883" build_landstalker_de_expanded.log
             echo 410d7cc56c7daf3ab6c7a061d1637b866565b2a0d2dca2b1319d4aafe497eb7b landstalker_de_expanded.bin | sha256sum -c

      - name: Build BETA Landstalker ROM
        working-directory: ${{github.workspace}}/landstalker_disasm
        shell: bash
        run: ./build.sh -r BETA -o landstalker_beta.bin | tee build_landstalker_beta.log

      - name: Verify BETA Landstalker ROM
        working-directory: ${{github.workspace}}/landstalker_disasm
        shell: bash
        run: |
             grep "Checksum: FBD3" build_landstalker_beta.log
             echo 64f4d40a45356107f00ad819e4fde792b1a413c6a22672a57ab8b4caf3c12a56 landstalker_beta.bin | sha256sum -c

      - name: Build BETA Expanded Landstalker ROM
        working-directory: ${{github.workspace}}/landstalker_disasm
        shell: bash
        run: ./build.sh -r BETA -e -o landstalker_beta_expanded.bin | tee build_landstalker_beta_expanded.log

      - name: Verify BETA Expanded Landstalker ROM
