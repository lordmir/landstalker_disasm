             echo c6e8d2e4733e0d369ad76ca643c17b1c4bd51a6119fefca9e4a6f8e7e6e342f7 landstalker_eur_expanded.bin | sha256sum -c

      - name: Build FR Landstalker ROM
        working-directory: ${{github.workspace}}/landstalker_disasm
        shell: bash
        run: ./build.sh -r FR -o landstalker_fr.bin | tee build_landstalker_fr.log

      - name: Verify FR Landstalker ROM
        working-directory: ${{github.workspace}}/landstalker_disasm
